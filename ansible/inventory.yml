#
# Physical servers:
#   gaybor_new  45.79.175.46  -> production
all:
  hosts:
    production:
      ansible_host: 45.79.175.46
      ansible_user: william
      ansible_ssh_private_key_file: ~/.ssh/id_rsa
      ansible_python_interpreter: /usr/bin/python3
